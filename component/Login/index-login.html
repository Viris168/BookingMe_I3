<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in or create an account - BookingME</title>

     <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/_design-tokens.css">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

    <div class="container">
        <!-- login form -->
         <div class="form-box login">
            <form action="/component/dashboard/profile.html">
                <h1>Login</h1>
                <div class="input-box">
                    <input type="text" placeholder="Username" autocomplete="username">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="input-box">
                    <input type="email" placeholder="Email" autocomplete="email">
                    <i class="fa-solid fa-envelope"></i>
                </div>
                <div class="input-box">
                    <input type="password" placeholder="Password" autocomplete="current-password">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <div class="forget-link">
                    <a href="/component/support/support.html">Forgot your password?</a>
                </div>
                <button type="submit" class="btn">Login</button>
                <p>or login with social platforms</p>
                <div class="social-icons">
                    <a href="/component/dashboard/profile.html"><i class="fa-brands fa-google"></i></a>
                    <a href="/component/dashboard/profile.html"><i class="fa-brands fa-facebook"></i></a>
                    <a href="/component/dashboard/profile.html"><i class="fa-brands fa-github"></i></a>
                    <a href="/component/dashboard/profile.html"><i class="fa-brands fa-linkedin"></i></a>
                </div>
            </form>
         </div>
         <!-- register form -->
         <div class="form-box register">
            <form action="/component/dashboard/profile.html">
    <h1>Register</h1>

    <div class="input-box">
      <input type="text" placeholder="Username" autocomplete="username">
      <i class="fa-solid fa-user"></i>
    </div>

    <div class="input-box">
      <input type="email" placeholder="Email" autocomplete="email">
      <i class="fa-solid fa-envelope"></i>
    </div>

    <div class="input-box">
      <input type="password" placeholder="Password" autocomplete="new-password">
      <i class="fa-solid fa-lock"></i>
    </div>

    <button type="submit" class="btn">Register</button>

    <p>or register with social platforms</p>
    <div class="social-icons">
      <a href="/component/dashboard/profile.html"><i class="fa-brands fa-google"></i></a>
      <a href="/component/dashboard/profile.html"><i class="fa-brands fa-facebook"></i></a>
      <a href="/component/dashboard/profile.html"><i class="fa-brands fa-github"></i></a>
      <a href="/component/dashboard/profile.html"><i class="fa-brands fa-linkedin"></i></a>
    </div>
  </form>
         </div>
         <!-- Toggle BOx -->
         <div class="toggle-box ">
            <!-- Toggle BOx Left -->
             <div class="toggle-panel toggle-left">
                <h1>Hello Welcome!</h1>
                <p>Already have an account?</p>
                <button class="btn register-btn" type="button">Register</button>
             </div>
             <!-- Toggle BOx Right -->
             <div class="toggle-panel toggle-right">
                <h1>Welcome Back!</h1>
                <p>Already have an account?</p>
                <button class="btn login-btn" type="button">Login</button>
             </div>
         </div>
    </div>
  <script src="/js/i18n.js"></script>
  <script src="../../js/script-login.js"></script>
</body>
</html>
