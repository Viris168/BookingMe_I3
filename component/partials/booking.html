<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookingME</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Kantumruy+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#2b8dee",
            "primary-dark": "#1a6fcc",
            "background-light": "#f6f7f8",
            "background-dark": "#101922",
          },
          fontFamily: {
            "sans": ["Inter", "Kantumruy Pro", "sans-serif"],
            "display": ["Inter", "Kantumruy Pro"],
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>

  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      font-size: 18px;
    }
    body {
      font-family: 'Inter', 'Kantumruy Pro', sans-serif;
    }


    .price-slider {
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 9999px;
      background: linear-gradient(to right, #2b8dee var(--pct, 47%), #e2e8f0 var(--pct, 47%));
      outline: none;
      cursor: pointer;
      width: 100%;
    }
    .price-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: #fff;
      border: 2.5px solid #2b8dee;
      box-shadow: 0 2px 8px rgba(43,141,238,.3);
      cursor: grab;
      transition: box-shadow .2s;
    }
    .price-slider::-webkit-slider-thumb:active {
      cursor: grabbing;
      box-shadow: 0 0 0 6px rgba(43,141,238,.15);
    }
    .price-slider::-moz-range-thumb {
      width: 18px; height: 18px;
      border-radius: 50%;
      background: #fff;
      border: 2.5px solid #2b8dee;
      box-shadow: 0 2px 8px rgba(43,141,238,.3);
      cursor: grab;
    }
    input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 15px; height: 15px; min-width: 15px;
      border-radius: 4px;
      border: 2px solid #cbd5e1;
      background: #fff;
      cursor: pointer;
      transition: all .2s;
      position: relative;
    }
    input[type="checkbox"]:checked {
      background: #2b8dee;
      border-color: #2b8dee;
    }
    input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 3.5px; top: 1px;
      width: 5px; height: 8px;
      border: 2px solid #fff;
      border-top: none; border-left: none;
      transform: rotate(45deg);
    }
    input[type="checkbox"]:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(43,141,238,.18);
    }


    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

<body class="bg-slate-50">

  <div id="header"></div>


  <div id="listing-view" class="mx-auto max-w-7xl px-4 sm:px-6 pt-24 pb-8 flex flex-col lg:flex-row gap-4 lg:gap-6 items-stretch lg:items-start">


    <div id="aside" class="w-full lg:sticky lg:top-24 lg:w-60 shrink-0"></div>


    <div id="section" class="contents"></div>

  </div>


  <div id="detail-view" class="hidden mx-auto max-w-7xl px-4 sm:px-6 pt-24 pb-8"></div>

  <div id="footer"></div>
  <script src="/js/i18n.js"></script>
  <script src="/js/components/script.js"></script>
  <script src="/js/components/layout.js"></script>

</body>
</html>
