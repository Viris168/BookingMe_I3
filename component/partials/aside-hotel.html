<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Filters</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Kantumruy+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#2b8dee",
                        "primary-dark": "#1a6fcc",
                    },
                    fontFamily: { sans: ["Inter", "Kantumruy Pro", "sans-serif"] },
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-size: 18px;
        }

        .price-slider {
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            border-radius: 9999px;
            background: linear-gradient(to right, #2b8dee var(--pct, 47%), #e2e8f0 var(--pct, 47%));
            outline: none;
            cursor: pointer;
            width: 100%;
        }

        .price-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fff;
            border: 2.5px solid #2b8dee;
            box-shadow: 0 2px 8px rgba(43, 141, 238, .3);
            cursor: grab;
            transition: box-shadow .2s;
        }

        .price-slider::-webkit-slider-thumb:active {
            cursor: grabbing;
            box-shadow: 0 0 0 6px rgba(43, 141, 238, .15);
        }

        .price-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fff;
            border: 2.5px solid #2b8dee;
            box-shadow: 0 2px 8px rgba(43, 141, 238, .3);
            cursor: grab;
        }

        input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            min-width: 18px;
            border-radius: 5px;
            border: 2px solid #cbd5e1;
            background: #fff;
            cursor: pointer;
            transition: all .2s;
            position: relative;
        }

        input[type="checkbox"]:checked {
            background: #2b8dee;
            border-color: #2b8dee;
        }

        input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            left: 4px;
            top: 1px;
            width: 6px;
            height: 10px;
            border: 2px solid #fff;
            border-top: none;
            border-left: none;
            transform: rotate(45deg);
        }

        input[type="checkbox"]:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(43, 141, 238, .18);
        }
    </style>
</head>
<body>
<aside class="w-full shrink-0" aria-label="Hotel filters">
    <div class="sticky top-20 z-30 mb-3 lg:hidden">
        <button id="open-filter-sheet" type="button" class="flex w-full items-center justify-between rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-semibold text-slate-800 shadow-sm">
            <span class="flex items-center gap-2">
                <span class="material-symbols-outlined text-[18px] text-primary">tune</span>
                Filters
            </span>
            <span data-filter-result-count class="text-xs font-bold text-primary">0 results</span>
        </button>
    </div>

    <div id="filter-backdrop" class="pointer-events-none fixed inset-0 z-40 bg-slate-950/45 opacity-0 transition-opacity duration-300 lg:hidden"></div>

    <div id="filter-sheet" class="fixed inset-x-0 bottom-0 z-50 flex max-h-[86vh] translate-y-full flex-col rounded-t-2xl bg-white shadow-2xl transition-transform duration-300 lg:static lg:z-auto lg:block lg:max-h-[calc(100vh-8rem)] lg:translate-y-0 lg:overflow-hidden lg:rounded-2xl lg:border lg:border-white/60 lg:bg-white/85 lg:backdrop-blur-xl lg:shadow-lg lg:shadow-primary/5">
        <div class="flex items-center justify-between border-b border-slate-100 px-4 py-3 lg:hidden">
            <div>
                <p class="text-sm font-bold text-slate-900">Filters</p>
                <p data-filter-result-count class="text-xs font-semibold text-primary">0 results</p>
            </div>
            <button id="close-filter-sheet" type="button" class="flex h-9 w-9 items-center justify-center rounded-full bg-slate-100 text-slate-600" aria-label="Close filters">
                <span class="material-symbols-outlined text-[20px]">close</span>
            </button>
        </div>

        <div class="min-h-0 flex-1 overflow-y-auto px-4 py-4 lg:max-h-none lg:overflow-visible lg:p-2">
            <div class="space-y-3 lg:space-y-1.5">
                <section class="space-y-1.5">
                    <div class="flex items-center justify-between">
                        <span class="text-[9px] font-bold uppercase tracking-widest text-slate-400">Budget Range</span>
                        <span id="price-display" class="text-[10px] font-bold text-primary">$525</span>
                    </div>
                    <input type="range" class="price-slider" id="price-range" data-filter="price" min="50" max="1000" step="10" value="525"/>
                    <div class="flex justify-between">
                        <span class="text-[9px] font-medium text-slate-400">$50</span>
                        <span class="text-[9px] font-medium text-slate-400">$1000+</span>
                    </div>
                </section>

                <hr class="border-slate-100">

                <section class="space-y-0.5">
                    <p class="text-[9px] font-bold uppercase tracking-widest text-slate-400 mb-0.5">Area / Location</p>
                    <label class="flex items-center gap-2 px-1.5 py-1 lg:py-0.5 rounded-lg cursor-pointer group hover:bg-primary/5 transition-colors">
                        <input type="checkbox" data-filter="university" data-value="rupp"/>
                        <span class="text-xs font-medium text-slate-600 group-hover:text-primary transition-colors">Independence Monument</span>
                    </label>
                    <label class="flex items-center gap-2 px-1.5 py-1 lg:py-0.5 rounded-lg cursor-pointer group hover:bg-primary/5 transition-colors">
                        <input type="checkbox" data-filter="university" data-value="itc"/>
                        <span class="text-xs font-medium text-slate-600 group-hover:text-primary transition-colors">Riverside</span>
                    </label>
                    <label class="flex items-center gap-2 px-1.5 py-1 lg:py-0.5 rounded-lg cursor-pointer group hover:bg-primary/5 transition-colors">
                        <input type="checkbox" data-filter="university" data-value="num"/>
                        <span class="text-xs font-medium text-slate-600 group-hover:text-primary transition-colors">Central Market</span>
                    </label>
                    <label class="flex items-center gap-2 px-1.5 py-1 lg:py-0.5 rounded-lg cursor-pointer group hover:bg-primary/5 transition-colors">
                        <input type="checkbox" data-filter="university" data-value="uea"/>
                        <span class="text-xs font-medium text-slate-600 group-hover:text-primary transition-colors">Aeon Mall Area</span>
                    </label>
                </section>

                <hr class="border-slate-100">

                <section class="space-y-0.5">
                    <p class="text-[9px] font-bold uppercase tracking-widest text-slate-400 mb-0.5">Room Type</p>
                    <label class="flex items-center gap-2 px-1.5 py-1 lg:py-0.5 rounded-lg cursor-pointer group hover:bg-primary/5 transition-colors">
                        <input type="checkbox" data-filter="roomType" data-value="privateroom"/>
                        <span class="text-xs font-medium text-slate-600 group-hover:text-primary transition-colors">Private Room</span>
                    </label>
                    <label class="flex items-center gap-2 px-1.5 py-1 lg:py-0.5 rounded-lg cursor-pointer group hover:bg-primary/5 transition-colors">
                        <input type="checkbox" data-filter="roomType" data-value="sharedroom"/>
                        <span class="text-xs font-medium text-slate-600 group-hover:text-primary transition-colors">Shared Room</span>
                    </label>
                    <label class="flex items-center gap-2 px-1.5 py-1 lg:py-0.5 rounded-lg cursor-pointer group hover:bg-primary/5 transition-colors">
                        <input type="checkbox" data-filter="roomType" data-value="suite"/>
                        <span class="text-xs font-medium text-slate-600 group-hover:text-primary transition-colors">Suite / Deluxe</span>
                    </label>
                    <label class="flex items-center gap-2 px-1.5 py-1 lg:py-0.5 rounded-lg cursor-pointer group hover:bg-primary/5 transition-colors">
                        <input type="checkbox" data-filter="roomType" data-value="apartment"/>
                        <span class="text-xs font-medium text-slate-600 group-hover:text-primary transition-colors">Apartment Stay</span>
                    </label>
                </section>

                <hr class="border-slate-100">

                <section class="space-y-0.5">
                    <p class="text-[9px] font-bold uppercase tracking-widest text-slate-400 mb-0.5">Hotel Essentials</p>
                    <label class="flex items-center gap-2 px-1.5 py-1 lg:py-0.5 rounded-lg cursor-pointer group hover:bg-primary/5 transition-colors">
                        <input type="checkbox" data-filter="amenity" data-value="wifi"/>
                        <span class="material-symbols-outlined text-[16px] text-slate-400 group-hover:text-primary transition-colors">wifi</span>
                        <span class="text-xs font-medium text-slate-600 group-hover:text-primary transition-colors">Wi-Fi</span>
                    </label>
                    <label class="flex items-center gap-2 px-1.5 py-1 lg:py-0.5 rounded-lg cursor-pointer group hover:bg-primary/5 transition-colors">
                        <input type="checkbox" data-filter="amenity" data-value="pool"/>
                        <span class="material-symbols-outlined text-[16px] text-slate-400 group-hover:text-primary transition-colors">pool</span>
                        <span class="text-xs font-medium text-slate-600 group-hover:text-primary transition-colors">Swimming Pool</span>
                    </label>
                    <label class="flex items-center gap-2 px-1.5 py-1 lg:py-0.5 rounded-lg cursor-pointer group hover:bg-primary/5 transition-colors">
                        <input type="checkbox" data-filter="amenity" data-value="restaurant"/>
                        <span class="material-symbols-outlined text-[16px] text-slate-400 group-hover:text-primary transition-colors">restaurant</span>
                        <span class="text-xs font-medium text-slate-600 group-hover:text-primary transition-colors">Breakfast Incl.</span>
                    </label>
                </section>

                <hr class="border-slate-100">

                <section class="space-y-0.5">
                    <p class="text-[9px] font-bold uppercase tracking-widest text-slate-400 mb-0.5">Guest Rating</p>
                    <label class="flex items-center gap-2 px-1.5 py-1 lg:py-0.5 rounded-lg cursor-pointer group hover:bg-primary/5 transition-colors">
                        <input type="checkbox" data-filter="rating" data-value="3.5"/>
                        <span class="text-xs font-medium text-slate-600 group-hover:text-primary transition-colors">3.5+ rating</span>
                    </label>
                    <label class="flex items-center gap-2 px-1.5 py-1 lg:py-0.5 rounded-lg cursor-pointer group hover:bg-primary/5 transition-colors">
                        <input type="checkbox" data-filter="rating" data-value="4.0"/>
                        <span class="text-xs font-medium text-slate-600 group-hover:text-primary transition-colors">4.0+ rating</span>
                    </label>
                    <label class="flex items-center gap-2 px-1.5 py-1 lg:py-0.5 rounded-lg cursor-pointer group hover:bg-primary/5 transition-colors">
                        <input type="checkbox" data-filter="rating" data-value="4.5"/>
                        <span class="text-xs font-medium text-slate-600 group-hover:text-primary transition-colors">4.5+ rating</span>
                    </label>
                </section>

                <hr class="border-slate-100">

                <div class="flex items-center justify-between pt-0.5">
                    <span data-filter-result-count class="text-[10px] font-semibold text-primary">0 results</span>
                    <button id="reset-btn" type="button" class="text-xs font-semibold text-slate-400 hover:text-slate-600 transition-colors">
                        Reset All
                    </button>
                </div>
            </div>
        </div>

        <div class="border-t border-slate-100 bg-white p-4 lg:hidden">
            <button id="show-filter-results" type="button" class="w-full rounded-xl bg-primary px-4 py-3 text-sm font-bold text-white shadow-lg shadow-primary/25">
                Show <span data-filter-result-count>0 results</span>
            </button>
        </div>
    </div>
</aside>
</body>
</html>
