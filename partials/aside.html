<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filters</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#2b8dee",
                        "primary-dark": "#1a6fcc",
                    },
                    fontFamily: { sans: ["Inter", "sans-serif"] },
                },
            },
        }
    </script>
    <style>
        /* Only things Tailwind can't do */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-size: 18px;
        }
        /* Slider track fill */
        .price-slider {
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            border-radius: 9999px;
            background: linear-gradient(to right, #2b8dee var(--pct, 47%), #e2e8f0 var(--pct, 47%));
            outline: none;
            cursor: pointer;
            width: 100%;
        }
        .price-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px; height: 18px;
            border-radius: 50%;
            background: #fff;
            border: 2.5px solid #2b8dee;
            box-shadow: 0 2px 8px rgba(43,141,238,.3);
            cursor: grab;
            transition: box-shadow .2s;
        }
        .price-slider::-webkit-slider-thumb:active {
            cursor: grabbing;
            box-shadow: 0 0 0 6px rgba(43,141,238,.15);
        }
        .price-slider::-moz-range-thumb {
            width: 18px; height: 18px;
            border-radius: 50%;
            background: #fff;
            border: 2.5px solid #2b8dee;
            box-shadow: 0 2px 8px rgba(43,141,238,.3);
            cursor: grab;
        }
        /* Checkbox custom style (Tailwind forms plugin handles base) */
        input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 18px; height: 18px; min-width: 18px;
            border-radius: 5px;
            border: 2px solid #cbd5e1;
            background: #fff;
            cursor: pointer;
            transition: all .2s;
            position: relative;
        }
        input[type="checkbox"]:checked {
            background: #2b8dee;
            border-color: #2b8dee;
        }
        input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            left: 4px; top: 1px;
            width: 6px; height: 10px;
            border: 2px solid #fff;
            border-top: none; border-left: none;
            transform: rotate(45deg);
        }
        input[type="checkbox"]:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(43,141,238,.18);
        }
    </style>
</head>
<body class="bg-slate-100 font-sans min-h-screen p-4 lg:p-6">

<div class="flex gap-4 lg:gap-5 items-start max-w-6xl mx-auto">

<aside class="w-full shrink-0">
    <div class="bg-white/85 backdrop-blur-xl border border-white/60 rounded-2xl shadow-lg shadow-primary/5 p-2 space-y-1.5 max-h-[calc(100vh-8rem)] overflow-hidden">
        <!-- Price Range -->
        <div class="space-y-1.5">
            <div class="flex items-center justify-between">
                <span class="text-[9px] font-bold uppercase tracking-widest text-slate-400">Budget Range</span>
                <span id="price-display" class="text-[10px] font-bold text-primary">$525</span>
            </div>
            <input type="range" class="price-slider" id="price-range" min="50" max="1000" step="10" value="525"/>
            <div class="flex justify-between">
                <span class="text-[9px] font-medium text-slate-400">$50</span>
                <span class="text-[9px] font-medium text-slate-400">$1000+</span>
            </div>
        </div>

        <hr class="border-slate-100">

        <!-- Near University -->
        <div class="space-y-0.5">
            <p class="text-[9px] font-bold uppercase tracking-widest text-slate-400 mb-0.5">Near University</p>
            <label class="flex items-center gap-2 px-1.5 py-0.5 rounded-lg cursor-pointer group hover:bg-primary/5 transition-colors">
                <input type="checkbox"/>
                <span class="text-xs font-medium text-slate-600 group-hover:text-primary transition-colors">RUPP Area</span>
            </label>
            <label class="flex items-center gap-2 px-1.5 py-0.5 rounded-lg cursor-pointer group hover:bg-primary/5 transition-colors">
                <input type="checkbox" checked/>
                <span class="text-xs font-medium text-slate-600 group-hover:text-primary transition-colors">ITC(Techno)</span>
            </label>
            <label class="flex items-center gap-2 px-1.5 py-0.5 rounded-lg cursor-pointer group hover:bg-primary/5 transition-colors">
                <input type="checkbox"/>
                <span class="text-xs font-medium text-slate-600 group-hover:text-primary transition-colors">NUM</span>
            </label>
            <label class="flex items-center gap-2 px-1.5 py-0.5 rounded-lg cursor-pointer group hover:bg-primary/5 transition-colors">
                <input type="checkbox"/>
                <span class="text-xs font-medium text-slate-600 group-hover:text-primary transition-colors">UEA</span>
            </label>
        </div>

        <hr class="border-slate-100">

        <!-- Room Type -->
        <div class="space-y-0.5">
            <p class="text-[9px] font-bold uppercase tracking-widest text-slate-400 mb-0.5">Room Type</p>
            <label class="flex items-center gap-2 px-1.5 py-0.5 rounded-lg cursor-pointer group hover:bg-primary/5 transition-colors">
                <input type="checkbox"/>
                <span class="text-xs font-medium text-slate-600 group-hover:text-primary transition-colors">Shared Room (Dorm)</span>
            </label>
            <label class="flex items-center gap-2 px-1.5 py-0.5 rounded-lg cursor-pointer group hover:bg-primary/5 transition-colors">
                <input type="checkbox" checked/>
                <span class="text-xs font-medium text-slate-600 group-hover:text-primary transition-colors">Private Room</span>
            </label>
            <label class="flex items-center gap-2 px-1.5 py-0.5 rounded-lg cursor-pointer group hover:bg-primary/5 transition-colors">
                <input type="checkbox"/>
                <span class="text-xs font-medium text-slate-600 group-hover:text-primary transition-colors">Studio Department</span>
            </label>
        </div>

        <hr class="border-slate-100">

        <!-- Student Essentials -->
        <div class="space-y-0.5">
            <p class="text-[9px] font-bold uppercase tracking-widest text-slate-400 mb-0.5">Student Essentials</p>
            <label class="flex items-center gap-2 px-1.5 py-0.5 rounded-lg cursor-pointer group hover:bg-primary/5 transition-colors">
                <input type="checkbox"/>
                <span class="material-symbols-outlined text-[16px] text-slate-400 group-hover:text-primary transition-colors">wifi</span>
                <span class="text-xs font-medium text-slate-600 group-hover:text-primary transition-colors">Wi-Fi</span>
            </label>
            <label class="flex items-center gap-2 px-1.5 py-0.5 rounded-lg cursor-pointer group hover:bg-primary/5 transition-colors">
                <input type="checkbox"/>
                <span class="material-symbols-outlined text-[16px] text-slate-400 group-hover:text-primary transition-colors">kitchen</span>
                <span class="text-xs font-medium text-slate-600 group-hover:text-primary transition-colors">Kitchen</span>
            </label>
            <label class="flex items-center gap-2 px-1.5 py-0.5 rounded-lg cursor-pointer group hover:bg-primary/5 transition-colors">
                <input type="checkbox"/>
                <span class="material-symbols-outlined text-[16px] text-slate-400 group-hover:text-primary transition-colors">laundry</span>
                <span class="text-xs font-medium text-slate-600 group-hover:text-primary transition-colors">Laundry Machine</span>
            </label>
        </div>

        <!-- LeaseTerm -->
        <div class="space-y-0.5">
            <p class="text-[9px] font-bold uppercase tracking-widest text-slate-400 mb-0.5">Lease Term</p>
            <label class="flex items-center gap-2 px-1.5 py-0.5 rounded-lg cursor-pointer group hover:bg-primary/5 transition-colors">
                <input type="checkbox"/>
                <span class="text-xs font-medium text-slate-600 group-hover:text-primary transition-colors">Monthly</span>
            </label>
            <label class="flex items-center gap-2 px-1.5 py-0.5 rounded-lg cursor-pointer group hover:bg-primary/5 transition-colors">
                <input type="checkbox" checked/>
                <span class="text-xs font-medium text-slate-600 group-hover:text-primary transition-colors">Semester</span>
            </label>
            <label class="flex items-center gap-2 px-1.5 py-0.5 rounded-lg cursor-pointer group hover:bg-primary/5 transition-colors">
                <input type="checkbox"/>
                <span class="text-xs font-medium text-slate-600 group-hover:text-primary transition-colors">Yearly</span>
            </label>
        </div>

        <hr class="border-slate-100">

        <!-- Actions -->
        <div class="space-y-1 pt-0">
            <button id="apply-btn" class="w-full py-1.5 rounded-xl bg-gradient-to-r from-primary to-primary-dark text-white text-xs font-bold shadow-lg shadow-primary/30 hover:-translate-y-0.5 hover:shadow-primary/40 active:translate-y-0 transition-all">
                Apply Filters
            </button>
            <button id="reset-btn" class="w-full py-1 rounded-xl text-xs font-semibold text-slate-400 hover:text-slate-600 transition-colors">
                Reset All
            </button>
        </div>

    </div>
</aside>

    <!-- Product cards area -->
    <div class="flex-1 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
        <!-- cards go here -->
    </div>

</div><!-- end flex row -->

<script>
    // Price slider
    const slider = document.getElementById('price-range');
    const display = document.getElementById('price-display');

    function updateSlider() {
        const min = +slider.min, max = +slider.max, val = +slider.value;
        const pct = ((val - min) / (max - min)) * 100;
        slider.style.setProperty('--pct', pct + '%');
        display.textContent = val >= 1000 ? '$1000+' : `$${val}`;
    }
    slider.addEventListener('input', updateSlider);
    updateSlider();

    // Rating pills
    const ratingBtns = document.querySelectorAll('.rating-btn');
    ratingBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            ratingBtns.forEach(b => {
                b.className = 'rating-btn px-3.5 py-1.5 rounded-full text-xs font-bold border border-slate-200 text-slate-500 bg-white hover:border-primary hover:text-primary transition-all';
            });
            btn.className = 'rating-btn px-3.5 py-1.5 rounded-full text-xs font-bold border border-primary bg-primary text-white shadow-md shadow-primary/30';
        });
    });

    // Reset
    function resetAll() {
        document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
        ratingBtns.forEach(b => {
            b.className = 'rating-btn px-3.5 py-1.5 rounded-full text-xs font-bold border border-slate-200 text-slate-500 bg-white hover:border-primary hover:text-primary transition-all';
        });
        slider.value = 525;
        updateSlider();
    }
    document.getElementById('reset-btn').addEventListener('click', resetAll);
   
    // Apply
    document.getElementById('apply-btn').addEventListener('click', () => {
        const checked = [...document.querySelectorAll('input[type="checkbox"]:checked')]
            .map(cb => cb.closest('label')?.querySelector('span:last-child')?.textContent)
            .filter(Boolean);
        const activeRating = document.querySelector('.rating-btn.border-primary.bg-primary')?.dataset.rating;
        alert(`Filters applied!\nMax price: $${slider.value}\nRating: ${activeRating ?? 'any'}+\nSelected: ${checked.join(', ') || 'none'}`);
    });
</script>
</body>
</html>
